<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library of Things | Rider University Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root { --rider-cranberry: #891b2f; --rider-dark: #212529; }
    .hero { background-color: var(--rider-cranberry); color: white; padding: 2.5rem 1rem; }
    .card-img-top { height: 210px; object-fit: cover; }
    .badge-cat { background-color: #f1f3f5; color: #495057; border: 1px solid #ced4da; }
  </style>
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="hero text-center shadow-sm">
    <h1 class="fw-bold">Library of Things</h1>
    <p class="lead mb-3">Borrow technology, media production tools, and gadgets for your projects.</p>
    <button class="btn btn-outline-light btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#suggestModal">
      💡 Suggest a Thing for the Collection
    </button>
  </header>

  <!-- Main Catalog Controls -->
  <main class="container my-4">
    <div class="row g-2 justify-content-between align-items-center mb-4">
      <div class="col-12 col-md-5">
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search gear, parts, or use cases..." />
      </div>
      <div class="col-12 col-md-auto d-flex flex-wrap gap-2" id="filterPills">
        <button class="btn btn-sm btn-dark filter-btn active" data-category="All">All Items</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-category="Audio & Podcasting">Audio</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-category="Video & Photo">Video</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-category="Study & Tech">Study & Tech</button>
      </div>
    </div>

    <!-- Dynamic Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="itemGrid"></div>
  </main>

  <!-- Suggestion Modal (Option 3) -->
  <div class="modal fade" id="suggestModal" tabindex="-1" aria-labelledby="suggestModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="suggestModalLabel">Suggest an Item to Borrow</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted">What tool or kit would help your class project or creative work? Tell us and we will evaluate it for upcoming procurement rounds.</p>
          <!-- Replace with your direct Google Form URL -->
          <div class="d-grid gap-2">
            <a href="https://docs.google.com/forms/d/e/.../viewform" target="_blank" class="btn btn-danger">Open Suggestion Form</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Logic Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allItems = [];
    let activeCategory = 'All';

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        allItems = data;
        renderItems(allItems);
      });

    function renderItems(items) {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';
      if (items.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted my-5"><h5>No matching gear found. Try another search term!</h5></div>';
        return;
      }
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'col';
        card.innerHTML = `
          <div class="card h-100 shadow-sm border-0">
            <img src="${item.image}" class="card-img-top" alt="${item.title}" onerror="this.src='https://placehold.co/600x400?text=No+Photo'">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge badge-cat">${item.category}</span>
                <small class="text-muted fw-bold">${item.loanPeriod} Loan</small>
              </div>
              <h5 class="card-title fw-bold">${item.title}</h5>
              <p class="small text-muted mb-3 flex-grow-1">
                <strong>Kit Includes:</strong> ${item.includes.join(', ')}
              </p>
              <div class="mt-auto d-grid">
                <a href="${item.catalogUrl}" target="_blank" class="btn btn-outline-dark btn-sm fw-semibold">Check Availability & Hold</a>
              </div>
            </div>
          </div>`;
        grid.appendChild(card);
      });
    }

    // Search and Filter Handlers
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('btn-dark', 'active'));
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('btn-outline-secondary'));
        e.target.classList.remove('btn-outline-secondary');
        e.target.classList.add('btn-dark', 'active');
        activeCategory = e.target.getAttribute('data-category');
        applyFilters();
      });
    });

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allItems.filter(item => {
        const matchesCat = (activeCategory === 'All' || item.category === activeCategory);
        const matchesSearch = item.title.toLowerCase().includes(q) ||
          item.includes.some(part => part.toLowerCase().includes(q)) ||
          item.tags.some(t => t.toLowerCase().includes(q));
        return matchesCat && matchesSearch;
      });
      renderItems(filtered);
    }
  </script>
</body>
</html>
